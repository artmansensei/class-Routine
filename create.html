<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Routine - VU Routine</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/create.css">
    <link rel="icon" type="image/png" href="icon/icon-192.png">
    <!-- PDF Generation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <!-- Sidebar Menu & Overlay -->
    <div id="menu-overlay" class="overlay"></div>
    <div id="sidebar-menu" class="sidebar">
        <div class="sidebar-header">
            <h2>⚙️</h2>
            <button id="close-menu" class="close-btn">✖</button>
        </div>
        
        <ul class="menu-list">
            <li id="menu-import" class="menu-item" style="color: #3b82f6; font-weight: bold;">📥 Import Default Routine</li>
            <li id="menu-print" class="menu-item">🖨️ Print Routine</li>
            <li id="theme-toggle" class="menu-item">🌙 Dark Mode</li>
            
            <li id="menu-back-main" class="menu-item" onclick="window.location.href='index.html'" style="color: #22c55e; margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">🏠 Back to Main Routine</li>
        </ul>
    </div>

    <!-- Header Section -->
    <header class="app-header">
        <div class="header-left">
            <button id="menu-btn" class="icon-btn">☰</button>
            <h1>My Custom Routine</h1>
        </div>
    </header>

    <!-- Custom Toast Alert -->
    <div id="custom-toast" class="toast-message">
        <span id="toast-text">Message</span>
    </div>

    <main class="routine-display">
        <!-- Day Selection Tabs -->
        <div id="day-tabs-container" class="day-tabs-container">
            <button class="day-tab active" data-day="Sunday">Sunday</button>
            <button class="day-tab" data-day="Monday">Monday</button>
            <button class="day-tab" data-day="Tuesday">Tuesday</button>
            <button class="day-tab" data-day="Wednesday">Wednesday</button>
            <button class="day-tab" data-day="Thursday">Thursday</button>
            <button class="day-tab" data-day="Friday">Friday</button>
            <button class="day-tab" data-day="Saturday">Saturday</button>
        </div>

        <div id="custom-routine-container" class="cards-container">
            <!-- Cards will be injected here via JS -->
        </div>

        <button id="add-class-btn" class="add-class-btn">
            <span style="font-size: 1.5rem;">+</span>
            <span>Add Class</span>
        </button>
    </main>

    <!-- Custom Modals Overlay -->
    <div id="custom-overlay" class="overlay"></div>

    <!-- 0. Confirm Action Modal -->
    <div id="action-confirm-modal" class="confirm-popup">
        <div class="popup-content" style="text-align: center; padding-top: 40px;">
            <h3 id="confirm-title" style="margin-top: 0; margin-bottom: 10px;">Are you sure?</h3>
            <p id="confirm-desc" style="font-size: 0.9rem; color: var(--time-color); margin-bottom: 25px;">This action cannot be undone.</p>
            <div class="popup-buttons">
                <button id="confirm-cancel-btn" class="popup-btn cancel-btn">Cancel</button>
                <button id="confirm-action-btn" class="popup-btn confirm-btn">Yes, Proceed</button>
            </div>
        </div>
    </div>

    <!-- 1. Import Routine Modal -->
    <div id="import-modal" class="confirm-popup">
        <div class="popup-content">
            <h3 style="border-bottom: none; margin-top: 0; margin-bottom: 5px;">📥 Import Routine</h3>
            <p style="font-size: 0.85rem; color: var(--time-color); margin-bottom: 20px;">Select a semester & section to copy its full schedule.</p>
            
            <div class="premium-input-group">
                <label>Semester</label>
                <select id="import-sem" class="premium-input">
                    <option value="1">1st Semester</option>
                    <option value="2">2nd Semester</option>
                    <option value="3">3rd Semester</option>
                    <option value="4">4th Semester</option>
                    <option value="5">5th Semester</option>
                    <option value="6">6th Semester</option>
                    <option value="7">7th Semester</option>
                    <option value="8">8th Semester</option>
                </select>
            </div>
            
            <div class="premium-input-group">
                <label>Section</label>
                <select id="import-sec" class="premium-input">
                    <option value="A">Section A</option>
                    <option value="B">Section B</option>
                    <option value="C">Section C</option>
                    <option value="D">Section D</option>
                    <option value="E">Section E</option>
                    <option value="F">Section F</option>
                </select>
            </div>

            <div class="popup-buttons" style="margin-top: 20px;">
                <button id="cancel-import-btn" class="popup-btn cancel-btn">Cancel</button>
                <button id="confirm-import-btn" class="popup-btn confirm-btn">Import Data</button>
            </div>
        </div>
    </div>

    <!-- 2. Add Class Modal -->
    <div id="add-class-modal" class="confirm-popup">
        <div class="popup-content">
            <h3 style="border-bottom: none; margin-top: 0; margin-bottom: 15px;">➕ New Class</h3>
            
            <div class="time-flex">
                <div class="premium-input-group">
                    <label>Start Time</label>
                    <input type="time" id="start-time" class="premium-input" required>
                </div>
                <div class="premium-input-group">
                    <label>End Time</label>
                    <input type="time" id="end-time" class="premium-input" required>
                </div>
            </div>

            <div class="premium-input-group">
                <label>Course Name</label>
                <input type="text" id="course-name" class="premium-input" placeholder="e.g. CSE 4101" required>
            </div>

            <div class="premium-input-group">
                <label>Room Number</label>
                <input type="text" id="room-num" class="premium-input" placeholder="e.g. 414" required>
            </div>

            <div class="premium-input-group">
                <label>Teacher Name (Optional)</label>
                <input type="text" id="teacher-name" class="premium-input" placeholder="e.g. John Doe">
            </div>

            <div class="popup-buttons" style="margin-top: 20px;">
                <button id="cancel-add-btn" class="popup-btn cancel-btn">Cancel</button>
                <button id="save-class-btn" class="popup-btn confirm-btn">Save Class</button>
            </div>
        </div>
    </div>

    <!-- External JavaScript File -->
    <script src="js/create.js"></script>
</body>
</html>
