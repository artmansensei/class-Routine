<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VU Routine</title>
    <!-- CSS Link -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="png" href="icon/routine.png">
</head>
<body>

    <!-- Pull to Refresh Indicator -->
    <div id="pull-indicator">⬇️ Pull down to refresh</div>

    <!-- Sidebar Menu & Overlay  -->
    <div id="menu-overlay" class="overlay"></div>

    <!-- Sidebar Menu & Overlay -->
    <div id="menu-overlay" class="overlay"></div>
    <div id="sidebar-menu" class="sidebar">
        <div class="sidebar-header">
            <h2>⚙️</h2>
            <button id="close-menu" class="close-btn">✖</button>
        </div>
        <ul class="menu-list">
            <li id="menu-print" class="menu-item">🖨️ Print Routine</li>
            <li id="menu-calendar" class="menu-item">🎓Student Login</li>
            <li id="theme-toggle" class="menu-item">🌙 Dark Mode</li>
            <li id="menu-about" class="menu-item">ℹ️ About App</li>
            <li id="reset-btn" class="menu-item">Reset</li>
        </ul>
    </div>

    <!-- Header Section (Updated with Hamburger Menu) -->
    <header class="app-header">
        <div class="header-left">
            <button id="menu-btn" class="icon-btn">☰</button>
            <h1>VU Routine</h1>

        </div>
    </header>

   <!-- Live Clock & Date Widget-->
    <div class="datetime-widget">
        <div class="time-display">
            <span id="live-time">00:00:00 AM</span>
            <span class="live-dot"></span>
        </div>
        <div class="date-display">
            <span id="live-date">Loading date...</span>
        </div>
    </div>

    

    <!-- Filter Section: Semester r Section select korar jayga -->
    <section class="filter-section">
        <select id="semester-select" class="dropdown">
            <option value="default" disabled selected>Select Semester</option>
            <!-- routine onujayi 7th semester -->
             <option value="1">1th Semester</option> 
             <option value="2">2th Semester</option> 
             <option value="3">3th Semester</option> 
             <option value="4">4th Semester</option> 
             <option value="5">5th Semester</option> 
             <option value="6">6th Semester</option> 
             <option value="7">7th Semester</option> 
             <option value="8">8th Semester</option>
        </select>

        <select id="section-select" class="dropdown">
            <option value="default" disabled selected>Select Section</option>
            <option value="A">Section A</option>
            <option value="B">Section B</option>
            <option value="C">Section C</option>
            <option value="D">Section D</option>
            <option value="E">Section E</option>
            <option value="F">Section F</option>
        </select>
    </section>

    <!-- Routine Display Section: Ekhane JavaScript card gulo show korbe -->
    <main class="routine-display">
        
        <!-- Day Selection Tabs (Default vabe hidden thakbe, drop-down select hole show korbe) -->
        <div id="day-tabs-container" class="day-tabs-container" style="display: none;">
            <button class="day-tab active" data-day="Sunday">Sunday</button>
            <button class="day-tab" data-day="Monday">Monday</button>
            <button class="day-tab" data-day="Tuesday">Tuesday</button>
            <button class="day-tab" data-day="Wednesday">Wednesday</button>
            <button class="day-tab" data-day="Thursday">Thursday</button>
            <button class="day-tab" data-day="Friday">Friday</button>
            <button class="day-tab" data-day="Saturday">Saturday</button>
        </div>

        <div id="routine-container" class="cards-container">
            <p class="placeholder-text">Please select your semester and section to view the routine.</p>
        </div>
    </main>

    <!-- Swap Confirmation Popup
    <div id="swap-confirm-popup" class="confirm-popup">
        <div class="popup-content">
            <h3>⚠️ Change Classes</h3>
            <p>Are you sure?</p>
            <div class="popup-buttons">
                <button id="cancel-swap-btn" class="popup-btn cancel-btn">No</button>
                <button id="confirm-swap-btn" class="popup-btn confirm-btn">Yes</button>
            </div>
        </div>
    </div> -->

    <!-- About App Modal -->
    <div id="about-modal" class="confirm-popup">
        <div class="popup-content">
            <svg width="40" height="40" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; margin-right: 10px;">
  <rect width="100" height="100" rx="20" fill="#2b2b2b" />
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="36" font-weight="bold">VU</text>
  <text x="50%" y="75%" dominant-baseline="middle" text-anchor="middle" fill="#f4f5f7" font-family="monospace" font-size="16" font-weight="bold">HUB</text>
</svg>
            <h3>VU Routine</h3>

            <p><br>Version: 1.0<br>Designed for CSE Students.</p>
            <p style="font-size: 0.85rem; opacity: 0.7;">Developed by Artman</p>
            <div class="popup-buttons">
                <button id="close-about-btn" class="popup-btn confirm-btn" style="width: 100%;">Got it!</button>
            </div>
        </div>
    </div>

  <!-- Class Note & Assignment Modal -->
    <div id="note-modal" class="confirm-popup">
        <div class="popup-content" style="text-align: left;">
            <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 10px;">📝 Note</h3>
            
            <p id="note-modal-course" style="font-size: 0.9rem; font-weight: 600; color: var(--primary-color, #2563eb); margin-bottom: 15px;"></p>

            <div style="margin-bottom: 15px;">
                <label style="font-size: 0.85rem; font-weight: 600; opacity: 0.8; display: block; margin-bottom: 5px;">Assignment / Exam Date:</label>
                <input type="date" id="note-deadline" style="width: 100%; padding: 10px; border-radius: var(--radius); border: 1px solid var(--border-color); background: var(--hover-bg); color: var(--text-color); outline: none; font-family: inherit; font-size: 1rem;">
            </div>

            
            <div style="margin-bottom: 20px;">
                <label style="font-size: 0.85rem; font-weight: 600; opacity: 0.8; display: block; margin-bottom: 5px;">Personal Notes:</label>
                <textarea id="note-text" placeholder="Write your notes here..." rows="4" style="width: 100%; padding: 10px; border-radius: var(--radius); border: 1px solid var(--border-color); background: var(--hover-bg); color: var(--text-color); outline: none; resize: none;"></textarea>
            </div>

            <div class="popup-buttons" style="justify-content: space-between;">
                <button id="delete-note-btn" class="popup-btn cancel-btn" style="display: none;">Delete</button>
                <div style="display: flex; gap: 10px; margin-left: auto;">
                    <button id="close-note-btn" class="popup-btn cancel-btn">Cancel</button>
                    <button id="save-note-btn" class="popup-btn confirm-btn">Save</button>
                </div>
            </div>
        </div>
    </div>
    <!-- SortableJS Library (Drag & Drop er jonno) -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script> -->
    
   
    <script src="js/main.js"></script>
</body>
</html>
